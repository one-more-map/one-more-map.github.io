name: Bug report
description: Something broken in the solver site
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: chart-text
    attributes:
      label: Chart text (for import problems)
      description: >
        If a chart imports wrongly, paste its full Ctrl+C item text here so the
        exact case can be reproduced.
  - type: input
    id: display
    attributes:
      label: Display setup
      placeholder: e.g. 2560x1440, 125% scaling, 2 monitors
